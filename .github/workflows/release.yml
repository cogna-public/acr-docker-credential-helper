name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build binaries
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: make build-static

      - name: Generate checksums
        run: |
          cd bin
          sha256sum docker-credential-acr-* > checksums.txt
          cat checksums.txt

      - name: Attest binaries
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'bin/docker-credential-acr-*'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/docker-credential-acr-linux-amd64
            bin/docker-credential-acr-linux-arm64
            bin/docker-credential-acr-darwin-amd64
            bin/docker-credential-acr-darwin-arm64
            bin/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
